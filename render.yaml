services:
  - type: web
    name: travel-assistant-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false # IMPORTANT: Set this to your Vercel frontend URL in the Render dashboard (e.g., https://my-frontend.vercel.app)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ROUTING_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true # Generates a secure secret automatically on Render
